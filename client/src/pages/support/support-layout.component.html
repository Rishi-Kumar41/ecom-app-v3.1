<!-- client/src/pages/support/support-layout.component.html -->
<div class="card support-card">
  <h2 class="title">Support</h2>

  <!-- Search -->
  <label class="label" for="q">Search</label>
  <div class="row">
    <input
      id="q"
      class="input"
      [(ngModel)]="q"
      placeholder="Search (orders, users, products...)"
    />

    <!-- NEW: Type filter -->
    <label class="label" style="margin-left:8px;">Type</label>
    <select [(ngModel)]="type" class="input" style="width:auto;">
      <option value="any">All</option>
      <option value="product">Products</option>
      <option value="order">Orders</option>
      <option value="user">Users</option>
      <option value="policy">Policy</option>
    </select>

    <!-- NEW: Top-K -->
    <label class="label" style="margin-left:8px;">Top&nbsp;K</label>
    <select [(ngModel)]="k" class="input" style="width:auto;">
      <option [value]="5">5</option>
      <option [value]="10">10</option>
      <option [value]="20">20</option>
    </select>

    <!-- NEW: Hybrid toggle -->
    <!-- <label class="label" style="display:flex; align-items:center; gap:6px; margin-left:8px;">
      <input type="checkbox" [(ngModel)]="hybrid" />
      <span>Hybrid</span>
    </label> -->

    <button class="btn" (click)="search()">Search</button>
  </div>

  <!-- Add product (existing) -->
  <div class="actions">
    <button class="btn" (click)="goToAdd()">Add product</button>
  </div>
</div>

<!-- Workspace -->
<div class="card">
  <h3 class="subtitle">Workspace</h3>
  <!-- <p class="muted">
    This area will show search results or admin tools. Coming soon.
  </p> -->
  <!-- Results Panel (drop this inside your Workspace card) -->
<div style="margin-top: 12px;">
  <div *ngIf="loading">Loading…</div>
  <div *ngIf="error" style="color:#b91c1c">{{ error }}</div>

  <ul *ngIf="!loading && !error && results.length" class="results">
    <li *ngFor="let r of results" style="padding:8px 0; border-bottom:1px solid #eee;">
      <div style="display:flex; gap:8px; align-items:center;">
        <span style="font-size:12px; background:#eef; color:#334; padding:2px 6px; border-radius:4px;">
          {{ r.source }}
        </span>
        <span style="font-size:12px; color:#666;">score: {{ r.score }}</span>
        <span *ngIf="r.product_id != null" style="font-size:12px; color:#666;">
            product_id: {{ r.product_id }}
          </span>
      </div>

      <div style="font-weight:600; margin-top:4px;">{{ r.title || '(untitled)' }}</div>
      <div style="color:#444; margin-top:2px;">{{ r.snippet }}</div>

      <a
        *ngIf="r.product_id"
        [routerLink]="['/product', r.product_id]"
        style="display:inline-block; margin-top:6px;"
      >
        View product
      </a>
    </li>
  </ul>

  <div *ngIf="!loading && !error && !results.length" class="muted">
    No results yet.
  </div>
</div>
</div>
<app-assist-floating></app-assist-floating>
