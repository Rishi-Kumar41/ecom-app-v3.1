<div class="box">
  <div class="card">
    <h2>Register</h2>
    <form (ngSubmit)="submit()">
      <div class="label">Name</div>
      <input class="input" [(ngModel)]="name" name="name" required />
      <div class="label">Email</div>
      <input class="input" [(ngModel)]="email" name="email" type="email" required />
      <div class="label">Password</div>
      <input class="input" [(ngModel)]="password" name="password" type="password" required minlength="6" />
      <button class="btn" type="submit" style="margin-top:12px">Create Account</button>
      <p *ngIf="error" style="color:red">{{error}}</p>
      <p *ngIf="ok" style="color:green">{{ok}}</p>
    </form>
    <p>Already have an account? <a class="link" routerLink="/login">Login</a></p>
  </div>
</div>
